name: 📝 Annual License Update Workflow

on:
  # This workflow runs on Jan 1st every year.
  schedule:
    - cron: "0 0 1 1 *"

jobs:
  update-license:
    name: 📝 Update License File
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to checkout the code and update the LICENSE file
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Update Copyright Date Range in LICENSE
        run: |
          set -eE  # <-- EXIT ON ERROR, ENSURE 'ERR' trap IS INHERITED IN SUBSHELLS

          function log_cmd_failure_and_exit() {
              printf '%s\n' \
                  '🚨LICENSE UPDATE FAILED🚨' \
                  "ERROR: Command '$BASH_COMMAND' exited with non-zero exit code (LINENO: $LINENO)."
              exit 1
          }

          trap log_cmd_failure_and_exit ERR

          year=$( date +%Y )
          sed -i -E "s/(Copyright © [0-9]{4})(–[0-9]{4})?(.*)/\1–$year\3/" ./LICENSE
          git add ./LICENSE
          git commit -m "chore(license): update copyright date range to include $year"
          git push

          echo '✅ License Copyright date range successfully updated.'
