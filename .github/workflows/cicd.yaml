name: 🚀 CI/CD Workflow

on:
  pull_request:
    types: [opened, reopened, synchronize] # default PR types
    branches: [main, next]
    paths:
      - "src/**/*"
      - "package*.json"
      - "scripts/**"
      - "tsconfig*.json"
      - ".nvmrc"
  push:
    branches: [main, next]
    paths:
      - "src/**/*"
      - "package*.json"
      - "scripts/**"
      - "tsconfig*.json"
      - ".nvmrc"
  # This workflow can be manually triggered
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Test
    uses: ./.github/workflows/test.yaml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: write #      to checkout the code and merge bot-PRs
      pull-requests: write # to add coverage reports to the PR
      statuses: write #      to update commit status

  release:
    name: 📦 Release
    needs: test # run job if event=push and tests passed
    if: github.event_name == 'push' && needs.test.outputs.success == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write # to generate artifact attestations for dist assets
      contents: write #     to create a release
      id-token: write #     for npm trusted publishing and provenance via OIDC
      issues: write #       to be able to comment on released issues
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # disable automatic caching in the release job

      - name: Install Dependencies
        run: npm ci --include=dev

      - name: Build Dist Assets
        run: npm run build

      - name: Run Semantic-Release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
